name: Image Build and Push

on:
    workflow_call:

jobs:
    Build-and-Push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            
            - name: Log in to Docker Hub
              uses: docker/login-action@v4
              with:
                    username: ${{ vars.DOCKERHUB_USERNAME }}
                    password: ${{ secrets.DOCKERHUB_TOKEN }}
            
            - name: Build and Push Docker Images
              run: |
                docker build -t ${{ vars.DOCKERHUB_USERNAME }}/chatapp-frontend:latest ./frontend
                docker push ${{ vars.DOCKERHUB_USERNAME }}/chatapp-frontend:latest
                docker build -t ${{ vars.DOCKERHUB_USERNAME }}/chatapp-backend:latest ./backend
                docker push ${{ vars.DOCKERHUB_USERNAME }}/chatapp-backend:latest

            
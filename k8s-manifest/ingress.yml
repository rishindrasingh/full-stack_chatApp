apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myingress
  namespace: chat-app
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5001

          - path: /
            pathType: Prefix
            backend:
              service:
                name: chatapp-frontend-service
                port:
                  number: 80